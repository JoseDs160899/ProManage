<div class="login-page">
  <div class="login-glow login-glow--one" aria-hidden="true"></div>
  <div class="login-glow login-glow--two" aria-hidden="true"></div>

  <section class="login-panel">
    <header class="login-brand">
      <span class="login-mark" aria-hidden="true">
        <i class="fa-solid fa-layer-group"></i>
      </span>
      <h1>ProManage</h1>
      <p>Gestiona proyectos con claridad.</p>
    </header>

    @if (error) {
      <div class="login-error" role="alert">{{ error }}</div>
    }

    <form class="login-form" [formGroup]="form" (ngSubmit)="ingresar()">
      <label class="login-field">
        <span>Usuario</span>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Tu usuario"
          autocomplete="username"
        />
      </label>

      <label class="login-field">
        <span>Contraseña</span>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </label>

      <button type="submit" class="login-submit" [disabled]="enviando">
        {{ enviando ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <footer class="login-hint">
      <p>admin / Admin123</p>
      <p>operador · maria · carlos / Operador123</p>
    </footer>
  </section>
</div>
