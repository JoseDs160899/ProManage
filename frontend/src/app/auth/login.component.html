<div class="login-wrapper">
  <div class="card login-card shadow">
    <div class="login-card__header">
      <div class="login-logo">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <h1 class="login-title">ProManage</h1>
      <p class="login-subtitle">Inicia sesión para gestionar tus proyectos</p>
    </div>

    <div class="card-body">
      @if (error) {
        <div class="alert alert-danger py-2">{{ error }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="ingresar()">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input id="username" type="text" class="form-control" formControlName="username"
                   placeholder="admin u operador" autocomplete="username" />
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input id="password" type="password" class="form-control" formControlName="password"
                   placeholder="••••••••" autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="enviando">
          <i class="fa-solid fa-right-to-bracket me-1"></i>
          {{ enviando ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <div class="login-hint">
        <strong>Usuarios de prueba:</strong>
        <span>admin / Admin123 (ADMIN)</span>
        <span>operador / Operador123 (OPERADOR)</span>
      </div>
    </div>
  </div>
</div>
