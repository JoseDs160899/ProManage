server.port=8081
spring.application.name=ProManage

# ===========================================================
#  Conexión a MySQL
#  (crea la base con: CREATE DATABASE promanage;)
#  >>> Cambia 'root' y la contraseña por tus credenciales <<<
# ===========================================================
# Laragon: MySQL escucha en 3307 (no 3306) y root suele ir sin contraseña
spring.datasource.url=jdbc:mysql://localhost:3307/promanage?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===========================================================
#  JPA / Hibernate
# ===========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================================================
#  Configuración del token JWT
#  jwt.secret: clave Base64 de al menos 32 bytes (laboratorio)
#  jwt.expiration: tiempo de vida del token en milisegundos (1 hora)
# ===========================================================
jwt.secret=Y2xhdmVfc2VjcmV0YV9kZV9sYWJvcmF0b3Jpb19wcm9tYW5hZ2VfMzJfYnl0ZXNfbWluaW1v
jwt.expiration=3600000
