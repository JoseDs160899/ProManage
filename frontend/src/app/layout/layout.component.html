<aside class="sidebar">
  <div class="p-4 logo">
    <i class="fa-solid fa-layer-group"></i>
    <span>ProManage</span>
  </div>
  <a routerLink="/projects" routerLinkActive="active">
    <i class="fa-solid fa-folder-open me-2"></i>Proyectos
  </a>
  <a href="javascript:void(0)" class="disabled-link">
    <i class="fa-solid fa-chart-column me-2"></i>Reportes
  </a>
</aside>

<main class="content">
  <header class="topbar d-flex justify-content-between align-items-center">
    <strong class="text-dark">Gestion de Proyectos</strong>
    <div class="user-menu d-flex align-items-center gap-2">
      <div class="user-avatar">{{ iniciales }}</div>
      <div class="d-flex flex-column lh-1">
        <span class="user-name">{{ username }}</span>
        <small class="text-muted">{{ rol }}</small>
      </div>
      <button class="btn btn-sm btn-outline-secondary ms-2" (click)="salir()" title="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <div class="container-fluid py-4">
    <router-outlet />
  </div>

  <footer class="text-center py-3">
    © 2026 ProManage. Todos los derechos reservados.
  </footer>
</main>
